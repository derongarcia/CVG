<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up — CVG</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
  </head>
  <body class="auth-page">
    <main class="auth">
      <section class="auth__panel">
        <a href="index.html" class="logo auth__logo">CVG</a>

        <header class="auth__head">
          <h1 class="auth__title">Create your account</h1>
          <p class="auth__subtitle">Start building your CV in minutes.</p>
        </header>

        <form class="auth__form" id="signupForm" novalidate>
          <div class="field">
            <label class="field__label" for="name">Full name</label>
            <input
              class="field__input"
              type="text"
              id="name"
              name="name"
              placeholder="Alexandra"
              autocomplete="name"
            />
            <p class="field__error" data-error-for="name"></p>
          </div>

          <div class="field">
            <label class="field__label" for="email">Email address</label>
            <input
              class="field__input"
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
            />
            <p class="field__error" data-error-for="email"></p>
          </div>

          <div class="field">
            <label class="field__label" for="password">Password</label>
            <div class="field__control">
              <input
                class="field__input"
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="new-password"
              />
              <button
                class="field__toggle"
                type="button"
                data-toggle="password"
                aria-label="Tampilkan password"
              >
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                  stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                  <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
                  <circle cx="12" cy="12" r="2.8" />
                </svg>
              </button>
            </div>
            <p class="field__hint">Minimal 8 karakter.</p>
            <p class="field__error" data-error-for="password"></p>
          </div>

          <div class="field">
            <label class="field__label" for="passwordConfirm">
              Confirm password
            </label>
            <div class="field__control">
              <input
                class="field__input"
                type="password"
                id="passwordConfirm"
                name="passwordConfirm"
                placeholder="Re-enter your password"
                autocomplete="new-password"
              />
              <button
                class="field__toggle"
                type="button"
                data-toggle="passwordConfirm"
                aria-label="Tampilkan konfirmasi password"
              >
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                  stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                  <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
                  <circle cx="12" cy="12" r="2.8" />
                </svg>
              </button>
            </div>
            <p class="field__error" data-error-for="passwordConfirm"></p>
          </div>

          <label class="checkbox">
            <input type="checkbox" id="terms" name="terms" />
            <span>
              I agree to the <a href="#" class="field__link">Terms</a> and
              <a href="#" class="field__link">Privacy Policy</a>
            </span>
          </label>
          <p class="field__error" data-error-for="terms"></p>

          <p class="auth__alert" id="signupAlert" hidden></p>

          <button class="btn btn--primary btn--block" type="submit" id="signupSubmit">
            Sign Up
          </button>
        </form>

        <div class="divider"><span>or</span></div>

        <button class="btn btn--outline btn--block btn--google" type="button">
          <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92a8.78 8.78 0 0 0 2.68-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
          </svg>
          Continue with Google
        </button>

        <p class="auth__foot">
          Already have an account?
          <a href="login.html" class="auth__footLink">Log in</a>
        </p>
      </section>

      <aside class="auth__aside">
        <div class="auth__artWrap">
          <div class="auth__blob" aria-hidden="true"></div>
          <img
            class="auth__art"
            src="assets/img/login-illustration.svg"
            alt=""
            onerror="this.style.display='none'"
          />
        </div>

        <div class="auth__asideText">
          <h2 class="auth__asideTitle">
            Better CV.<br />
            Bigger Opportunities.
          </h2>
          <p class="auth__asideDesc">
            Get personalized job recommendations, company suggestions, and more.
          </p>
        </div>
      </aside>
    </main>

    <script src="assets/js/signup.js"></script>
  </body>
</html>
